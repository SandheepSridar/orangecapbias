version: 2

models:
  - name: int_batter_season
    description: >
      One row per batter per season. balls_faced = legal deliveries (wides excluded).
      position_group derived from avg_pos using the position_group macro.
    columns:
      - name: season
        tests: [not_null]
      - name: batter
        tests: [not_null]
      - name: balls_faced
        description: "Legal balls faced (wides excluded)"
        tests: [not_null]
      - name: position_group
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Opener (1-2)', 'Top Order (3)', 'Middle Order (4-5)', 'Finisher (6+)']

  - name: int_team_season
    description: "One row per team per season with match count and playoff status."
    columns:
      - name: season
        tests: [not_null]
      - name: team
        tests: [not_null]
      - name: matches
        tests: [not_null]
      - name: made_playoffs
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
